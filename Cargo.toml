[package]
name = "serax"
version = "1.0.0"
edition = "2024"
description = "An easy to use serialization library for Rust."
license = "GPL-3.0-or-later"
authors = ["HappyPotato5"]
repository = "https://github.com/HappyPotato5/serax"

[dependencies]
serax_macros = { version = "1.0.0", path = "serax_macros", documentation = false }

[workspace]
resolver = "3"
members = ["serax_macros"]